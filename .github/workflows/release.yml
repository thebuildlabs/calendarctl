name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: macos-latest
    env:
      SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.x"

      - name: Import Developer ID signing certificate
        if: env.SIGN_IDENTITY != ''
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
          SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.SIGNING_CERTIFICATE_P12_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: ./scripts/import-signing-cert.sh

      - name: Build native EventKit bridge
        run: make bridge
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}

      - name: Verify release signing
        if: env.SIGN_IDENTITY != ''
        run: make verify-signing
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
          TEAM_ID: ${{ env.TEAM_ID }}

      - name: Remove signing keychain
        if: always() && env.SIGN_IDENTITY != ''
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
