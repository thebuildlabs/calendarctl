version: 2

project_name: calendarctl

before:
  hooks:
    - go mod tidy
    - make bridge

builds:
  - id: calendarctl-darwin
    main: ./cmd/calendarctl
    binary: calendarctl
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/thebuildlabs/calendarctl/internal/cli.version={{ .Version }}{{ if .Env.TEAM_ID }} -X github.com/thebuildlabs/calendarctl/internal/bridge.expectedTeamID={{ .Env.TEAM_ID }}{{ end }}

  - id: calendarctl-other
    main: ./cmd/calendarctl
    binary: calendarctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X github.com/thebuildlabs/calendarctl/internal/cli.version={{ .Version }}{{ if .Env.TEAM_ID }} -X github.com/thebuildlabs/calendarctl/internal/bridge.expectedTeamID={{ .Env.TEAM_ID }}{{ end }}

# The helper pins the caller's Developer ID Team ID, so release binaries must
# be signed. `make bridge` (before hook) pins that same Team ID in the helper's
# Info.plist when SIGN_IDENTITY is set.
signs:
  - id: darwin-codesign
    ids:
      - calendarctl-darwin
    artifacts: binary
    cmd: codesign
    args:
      - --force
      - --sign
      - "{{ .Env.SIGN_IDENTITY }}"
      - --identifier
      - com.thebuildlabs.calendarctl
      - --options
      - runtime
      - "${artifact}"

archives:
  - id: darwin
    builds:
      - calendarctl-darwin
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - src: bin/EventKitBridge.app
        dst: EventKitBridge.app

  - id: other
    builds:
      - calendarctl-other
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - name: calendarctl
    repository:
      owner: thebuildlabs
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/thebuildlabs/calendarctl
    description: "Modern calendar management for the terminal"
    license: MIT
    test: |
      system "#{bin}/calendarctl", "version"
    install: |
      bin.install "calendarctl"
      if OS.mac?
        bin.install "EventKitBridge"
        bin.install "EventKitBridge.app"
      end

release:
  github:
    owner: thebuildlabs
    name: calendarctl
  draft: false
  prerelease: auto
