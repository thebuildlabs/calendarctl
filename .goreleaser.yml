version: 2

project_name: calendarctl

before:
  hooks:
    - go mod tidy
    - make bridge

builds:
  - id: calendarctl-darwin
    main: ./cmd/calendarctl
    binary: calendarctl
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    hooks:
      post:
        - ./scripts/sign-cli.sh "{{ .Target }}" "{{ .Path }}"
    ldflags:
      - -s -w -X github.com/thebuildlabs/calendarctl/internal/cli.version={{ .Version }}{{ if .Env.TEAM_ID }} -X github.com/thebuildlabs/calendarctl/internal/bridge.expectedTeamID={{ .Env.TEAM_ID }}{{ end }}

  - id: calendarctl-other
    main: ./cmd/calendarctl
    binary: calendarctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X github.com/thebuildlabs/calendarctl/internal/cli.version={{ .Version }}{{ if .Env.TEAM_ID }} -X github.com/thebuildlabs/calendarctl/internal/bridge.expectedTeamID={{ .Env.TEAM_ID }}{{ end }}

# The helper pins the caller's signing identity, so release binaries must be
# signed. Without a Developer ID we fall back to ad-hoc signing with the same
# stable identifier; `make bridge` pins the Team ID only when one is set.
signs:
  - id: darwin-codesign
    ids:
      - calendarctl-darwin
    artifacts: binary
    cmd: codesign
    args:
      - --force
      - --sign
      - "{{ if .Env.SIGN_IDENTITY }}{{ .Env.SIGN_IDENTITY }}{{ else }}-{{ end }}"
      - --identifier
      - com.thebuildlabs.calendarctl
      - --options
      - runtime
      - "${artifact}"

archives:
  - id: darwin
    builds:
      - calendarctl-darwin
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - src: bin/EventKitBridge
        dst: EventKitBridge
      - src: bin/EventKitBridge.app
        dst: EventKitBridge.app

  - id: other
    builds:
      - calendarctl-other
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - name: calendarctl
    directory: Formula
    repository:
      owner: thebuildlabs
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/thebuildlabs/calendarctl
    description: "Modern calendar management for the terminal"
    license: MIT
    test: |
      system "#{bin}/calendarctl", "version"
    post_install: |
      if OS.mac?
        helper = "#{bin}/EventKitBridge"
        unless system("codesign", "--verify", "--strict", helper, out: File::NULL, err: File::NULL)
          # CI's codesign can leave the embedded Info.plist unbound; the
          # installing Mac's codesign produces a valid ad-hoc signature.
          # Homebrew installs binaries 0555, so make it writable first.
          FileUtils.chmod(0o755, helper)
          system "codesign", "--force", "--sign", "-", "--identifier",
                 "com.thebuildlabs.calendarctl.bridge", helper
          FileUtils.chmod(0o555, helper)
        end
      end
    install: |
      bin.install "calendarctl"
      if OS.mac?
        bin.install "EventKitBridge"
        prefix.install "EventKitBridge.app"
        bin.install_symlink prefix/"EventKitBridge.app" => "EventKitBridge.app"
      end

release:
  github:
    owner: thebuildlabs
    name: calendarctl
  draft: false
  prerelease: auto
